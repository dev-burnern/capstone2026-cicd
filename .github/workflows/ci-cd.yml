name: CI/CD

on:
  push:
    branches:
      - main
      - dev
      - "feat/**"
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend Test And Package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Test and package
        run: ./mvnw -B clean package

      - name: Upload backend jar
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: |
            backend/target/*.jar
            !backend/target/*.jar.original

  frontend:
    name: Frontend Test And Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: CI=true npm test -- --watchAll=false

      - name: Build frontend
        run: npm run build

      - name: Upload frontend build
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/build

  docker:
    name: Docker Build And Publish
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Package backend jar
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw -B -DskipTests clean package

      - name: Build Docker images
        run: |
          docker build -t yj-backend:ci ./backend
          docker build -t yj-frontend:ci ./frontend

      - name: Login to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker images
        if: github.ref == 'refs/heads/main'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"

          docker tag yj-backend:ci "$DOCKERHUB_USERNAME/yj-backend:1.0"
          docker tag yj-backend:ci "$DOCKERHUB_USERNAME/yj-backend:latest"
          docker tag yj-backend:ci "$DOCKERHUB_USERNAME/yj-backend:$SHORT_SHA"

          docker tag yj-frontend:ci "$DOCKERHUB_USERNAME/yj-frontend:1.0"
          docker tag yj-frontend:ci "$DOCKERHUB_USERNAME/yj-frontend:latest"
          docker tag yj-frontend:ci "$DOCKERHUB_USERNAME/yj-frontend:$SHORT_SHA"

          docker push "$DOCKERHUB_USERNAME/yj-backend:1.0"
          docker push "$DOCKERHUB_USERNAME/yj-backend:latest"
          docker push "$DOCKERHUB_USERNAME/yj-backend:$SHORT_SHA"

          docker push "$DOCKERHUB_USERNAME/yj-frontend:1.0"
          docker push "$DOCKERHUB_USERNAME/yj-frontend:latest"
          docker push "$DOCKERHUB_USERNAME/yj-frontend:$SHORT_SHA"
